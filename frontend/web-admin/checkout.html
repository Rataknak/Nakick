<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - NAKick Shoes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <script src="https://www.paypal.com/sdk/js?client-id=AdVcFivKk1XGdSqWpN3PZv3s3o7Q_pOTU9zMLwqthTkzGLGnGu6-3IvIzjLFz-WKYgH0eqb8bQeCjXNr&currency=USD"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        :root {
            --red-primary: #e31b23;
            --red-light: #fce8e9;
            --red-soft: #fff1f2;
            --red-dark: #b00f16;
            --gray-bg: #f4f6fa;
            --card-white: #ffffff;
            --text-dark: #1e1f2a;
            --text-muted: #5e6472;
            --border-light: #eef0f3;
            --shadow-sm: 0 4px 12px -6px rgba(0,0,0,0.05);
            --shadow-md: 0 12px 28px -10px rgba(0,0,0,0.05);
            --shadow-lg: 0 20px 30px -12px rgba(227,27,35,0.15);
            --gradient-primary: linear-gradient(135deg, var(--red-primary) 0%, #ff6b6b 100%);
        }

        body {
            background: var(--gray-bg);
            color: var(--text-dark);
            min-height: 100vh;
        }

        .checkout-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 2rem;
        }

        .checkout-header {
            grid-column: 1 / -1;
            text-align: center;
            margin-bottom: 2rem;
        }

        .checkout-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }

        .checkout-header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .order-summary, .payment-section {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: var(--shadow-md);
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-title i {
            color: var(--red-primary);
            background: var(--red-light);
            padding: 8px;
            border-radius: 10px;
            font-size: 1rem;
        }

        .cart-item {
            display: flex;
            gap: 1rem;
            padding: 1rem;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 1rem;
        }

        .cart-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .item-image {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            object-fit: cover;
            background: var(--gray-bg);
        }

        .item-details {
            flex: 1;
        }

        .item-name {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .item-sku {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .item-price {
            font-weight: 700;
            color: var(--red-primary);
            font-size: 1.1rem;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .quantity-btn {
            width: 30px;
            height: 30px;
            border: 1px solid var(--border-light);
            background: white;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .quantity-btn:hover {
            background: var(--red-light);
            color: var(--red-primary);
        }

        .quantity {
            font-weight: 600;
            min-width: 30px;
            text-align: center;
        }

        .order-total {
            border-top: 2px solid var(--border-light);
            padding-top: 1rem;
            margin-top: 1.5rem;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .total-row.final {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--text-dark);
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-light);
        }

        .paypal-button-container {
            margin-top: 2rem;
        }

        #paypal-button {
            width: 100%;
            height: 50px;
        }

        .loading-spinner {
            display: none;
            text-align: center;
            padding: 2rem;
        }

        .loading-spinner.active {
            display: block;
        }

        .spinner {
            border: 4px solid var(--border-light);
            border-top: 4px solid var(--red-primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: var(--red-light);
            color: var(--red-primary);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            display: none;
        }

        .error-message.active {
            display: block;
        }

        .success-message {
            background: #e0f2e2;
            color: #1f7840;
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            display: none;
        }

        .success-message.active {
            display: block;
        }

        @media (max-width: 768px) {
            .checkout-container {
                grid-template-columns: 1fr;
                padding: 1rem;
            }

            .checkout-header h1 {
                font-size: 2rem;
            }

            .cart-item {
                flex-direction: column;
                text-align: center;
            }

            .item-image {
                width: 100%;
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <div class="checkout-header">
            <h1><i class="fas fa-shoe-prints"></i> NAKick Checkout</h1>
            <p>Complete your order securely with PayPal</p>
        </div>

        <div class="order-summary">
            <h2 class="section-title">
                <i class="fas fa-shopping-cart"></i>
                Order Summary
            </h2>
            
            <div id="cart-items">
                <div class="loading-spinner active">
                    <div class="spinner"></div>
                    <p>Loading your cart...</p>
                </div>
            </div>

            <div class="order-total">
                <div class="total-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="total-row">
                    <span>Shipping:</span>
                    <span id="shipping">$0.00</span>
                </div>
                <div class="total-row">
                    <span>Tax:</span>
                    <span id="tax">$0.00</span>
                </div>
                <div class="total-row final">
                    <span>Total:</span>
                    <span id="total">$0.00</span>
                </div>
            </div>
        </div>

        <div class="payment-section">
            <h2 class="section-title">
                <i class="fas fa-lock"></i>
                Secure Payment
            </h2>

            <div class="error-message" id="error-message">
                <i class="fas fa-exclamation-circle"></i>
                <span id="error-text"></span>
            </div>

            <div class="success-message" id="success-message">
                <i class="fas fa-check-circle"></i>
                <span id="success-text"></span>
            </div>

            <div class="paypal-button-container">
                <div id="paypal-button"></div>
            </div>

            <p style="text-align: center; margin-top: 1rem; color: var(--text-muted); font-size: 0.9rem;">
                <i class="fas fa-shield-alt"></i> 
                Your payment information is secure and encrypted
            </p>
        </div>
    </div>

    <script>
        const GATEWAY_BASE_URL = 'http://localhost:8080';
        const PAYMENT_SERVICE_URL = 'http://localhost:8085';
        
        let cartData = [];
        let currentPayment = null;

        // Load cart data
        async function loadCart() {
            try {
                const response = await fetch(`${GATEWAY_BASE_URL}/cart-service/api/cart`, {
                    headers: {
                        'Authorization': `Bearer ${getAuthToken()}`
                    }
                });

                if (!response.ok) throw new Error('Failed to load cart');

                const cart = await response.json();
                cartData = cart.items || [];
                renderCart();
                initializePayPal();

            } catch (error) {
                console.error('Error loading cart:', error);
                showError('Failed to load cart items');
            }
        }

        function getAuthToken() {
            return localStorage.getItem('authToken') || sessionStorage.getItem('authToken') || '';
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            
            if (cartData.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 2rem; color: var(--text-muted);">
                        <i class="fas fa-shopping-cart" style="font-size: 3rem; margin-bottom: 1rem;"></i>
                        <p>Your cart is empty</p>
                        <a href="dashboard.html" style="color: var(--red-primary); text-decoration: none; font-weight: 600;">
                            <i class="fas fa-arrow-left"></i> Continue Shopping
                        </a>
                    </div>
                `;
                return;
            }

            let subtotal = 0;
            const itemsHtml = cartData.map(item => {
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;
                
                return `
                    <div class="cart-item">
                        <img src="${item.imageUrl || '/images/placeholder.jpg'}" alt="${item.productName}" class="item-image">
                        <div class="item-details">
                            <div class="item-name">${item.productName}</div>
                            <div class="item-sku">SKU: ${item.skuCode}</div>
                            <div class="item-price">$${item.price.toFixed(2)}</div>
                            <div class="quantity-control">
                                <button class="quantity-btn" onclick="updateQuantity('${item.skuCode}', ${item.quantity - 1})">
                                    <i class="fas fa-minus"></i>
                                </button>
                                <span class="quantity">${item.quantity}</span>
                                <button class="quantity-btn" onclick="updateQuantity('${item.skuCode}', ${item.quantity + 1})">
                                    <i class="fas fa-plus"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = itemsHtml;
            
            // Calculate totals
            const shipping = subtotal > 0 ? 10.00 : 0; // $10 shipping if cart has items
            const tax = subtotal * 0.08; // 8% tax
            const total = subtotal + shipping + tax;

            document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
            document.getElementById('shipping').textContent = `$${shipping.toFixed(2)}`;
            document.getElementById('tax').textContent = `$${tax.toFixed(2)}`;
            document.getElementById('total').textContent = `$${total.toFixed(2)}`;
        }

        async function updateQuantity(skuCode, newQuantity) {
            if (newQuantity < 1) return;
            
            try {
                const response = await fetch(`${GATEWAY_BASE_URL}/cart-service/api/cart/items/${skuCode}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${getAuthToken()}`
                    },
                    body: JSON.stringify({ quantity: newQuantity })
                });

                if (response.ok) {
                    await loadCart(); // Reload cart
                }
            } catch (error) {
                console.error('Error updating quantity:', error);
            }
        }

        function initializePayPal() {
            if (cartData.length === 0) return;

            const total = document.getElementById('total').textContent.replace('$', '');
            
            paypal.Buttons({
                createOrder: async function(data, actions) {
                    try {
                        showLoading(true);
                        
                        const paymentRequest = {
                            orderId: 'ORDER-' + Date.now(),
                            amount: parseFloat(total),
                            currency: 'USD',
                            description: 'NAKick Shoes Purchase',
                            items: cartData.map(item => ({
                                productId: item.productId,
                                productName: item.productName,
                                skuCode: item.skuCode,
                                quantity: item.quantity,
                                unitPrice: item.price,
                                totalPrice: item.price * item.quantity
                            }))
                        };

                        const response = await fetch(`${PAYMENT_SERVICE_URL}/api/payments/create`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${getAuthToken()}`
                            },
                            body: JSON.stringify(paymentRequest)
                        });

                        if (!response.ok) throw new Error('Failed to create payment');

                        const payment = await response.json();
                        currentPayment = payment;
                        
                        showLoading(false);
                        return payment.paymentId;

                    } catch (error) {
                        console.error('Error creating PayPal order:', error);
                        showError('Failed to create payment. Please try again.');
                        showLoading(false);
                        throw error;
                    }
                },

                onApprove: async function(data, actions) {
                    try {
                        showLoading(true);
                        
                        const response = await fetch(`${PAYMENT_SERVICE_URL}/api/payments/execute`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/x-www-form-urlencoded',
                                'Authorization': `Bearer ${getAuthToken()}`
                            },
                            body: new URLSearchParams({
                                paymentId: data.orderID,
                                payerId: data.payerID,
                                orderId: currentPayment.orderId
                            })
                        });

                        if (!response.ok) throw new Error('Failed to execute payment');

                        const result = await response.json();
                        
                        if (result.status === 'COMPLETED') {
                            showSuccess('Payment completed successfully! Redirecting to order confirmation...');
                            
                            // Create order in the system
                            await createOrder(currentPayment.orderId, result.paymentId);
                            
                            // Clear cart
                            await clearCart();
                            
                            // Redirect to order confirmation
                            setTimeout(() => {
                                window.location.href = 'order-confirmation.html?orderId=' + currentPayment.orderId;
                            }, 2000);
                        } else {
                            showError('Payment was not completed. Please try again.');
                        }
                        
                        showLoading(false);

                    } catch (error) {
                        console.error('Error executing payment:', error);
                        showError('Payment failed. Please try again.');
                        showLoading(false);
                    }
                },

                onError: function(err) {
                    console.error('PayPal error:', err);
                    showError('Payment error occurred. Please try again.');
                    showLoading(false);
                },

                onCancel: function(data) {
                    console.log('Payment cancelled:', data);
                    showError('Payment was cancelled. You can try again when ready.');
                    showLoading(false);
                }
            }).render('#paypal-button');
        }

        async function createOrder(orderId, paymentId) {
            try {
                const orderData = {
                    orderId: orderId,
                    paymentId: paymentId,
                    items: cartData,
                    totalAmount: parseFloat(document.getElementById('total').textContent.replace('$', '')),
                    status: 'PAID'
                };

                const response = await fetch(`${GATEWAY_BASE_URL}/order-service/api/orders`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${getAuthToken()}`
                    },
                    body: JSON.stringify(orderData)
                });

                if (!response.ok) {
                    console.error('Failed to create order:', response.statusText);
                }
            } catch (error) {
                console.error('Error creating order:', error);
            }
        }

        async function clearCart() {
            try {
                await fetch(`${GATEWAY_BASE_URL}/cart-service/api/cart`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${getAuthToken()}`
                    }
                });
            } catch (error) {
                console.error('Error clearing cart:', error);
            }
        }

        function showLoading(show) {
            const spinner = document.querySelector('.loading-spinner');
            if (spinner) {
                spinner.classList.toggle('active', show);
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            errorText.textContent = message;
            errorDiv.classList.add('active');
            
            setTimeout(() => {
                errorDiv.classList.remove('active');
            }, 5000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('success-message');
            const successText = document.getElementById('success-text');
            successText.textContent = message;
            successDiv.classList.add('active');
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', loadCart);
    </script>
</body>
</html>
