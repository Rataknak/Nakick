<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoes Management - NAKick Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* === MODERN DESIGN SYSTEM === */
        :root {
            --red-primary: #e31b23;
            --red-light: #fce8e9;
            --red-soft: #fff1f2;
            --red-dark: #b00f16;
            --gray-bg: #f4f6fa;
            --card-white: #ffffff;
            --text-dark: #1e1f2a;
            --text-muted: #5e6472;
            --border-light: #eef0f3;
            --shadow-sm: 0 4px 12px -6px rgba(0,0,0,0.05);
            --shadow-md: 0 12px 28px -10px rgba(0,0,0,0.05);
            --shadow-lg: 0 20px 30px -12px rgba(227,27,35,0.15);
            --gradient-primary: linear-gradient(135deg, var(--red-primary) 0%, #ff6b6b 100%);
            --gradient-soft: linear-gradient(135deg, var(--red-soft) 0%, #ffe5e5 100%);
        }

        body {
            background: var(--gray-bg);
            display: flex;
            min-height: 100vh;
            color: var(--text-dark);
        }

        /* === SIDEBAR === */
        .dashboard-sidebar {
            width: 280px;
            background: white;
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            padding: 2rem 1.5rem;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            box-shadow: 4px 0 15px -8px rgba(0,0,0,0.05);
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 2.5rem;
            padding-left: 0.5rem;
        }

        .logo-fallback {
            width: 42px;
            height: 42px;
            background: var(--red-primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 1.5rem;
            box-shadow: 0 8px 14px -6px rgba(227,27,35,0.25);
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-dark);
        }

        .logo-text span { color: var(--red-primary); }

        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.8rem 1rem;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
            color: var(--text-muted);
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .nav-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--gradient-primary);
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: -1;
        }

        .nav-item:hover {
            background: var(--red-light);
            color: var(--red-primary);
            transform: translateX(8px);
        }

        .nav-item:hover::before {
            left: 0;
        }

        .nav-item.active {
            background: var(--gradient-primary);
            color: white;
            box-shadow: 0 8px 25px -8px rgba(227,27,35,0.4);
            transform: translateX(4px);
        }

        .nav-item.active::before {
            left: 0;
        }

        .nav-item i { width: 20px; text-align: center; }

        /* === MAIN CONTENT === */
        .dashboard-main {
            flex: 1;
            padding: 2rem 2.5rem;
            overflow-y: auto;
        }

        .main-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2.2rem;
        }

        .header-left h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-left h1 i {
            color: var(--red-primary);
            background: var(--red-light);
            padding: 10px;
            border-radius: 16px;
            font-size: 1.5rem;
        }

        .header-left p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 4px;
            margin-left: 3.5rem;
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: white;
            border: none;
            padding: 0.8rem 1.8rem;
            border-radius: 16px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 25px -8px rgba(227,27,35,0.25);
            display: flex;
            align-items: center;
            gap: 0.6rem;
            position: relative;
            overflow: hidden;
        }

        .btn-primary:hover {
            background: var(--gradient-primary);
            transform: translateY(-3px);
            box-shadow: 0 12px 35px -8px rgba(227,27,35,0.35);
        }

        .btn-secondary {
            background: white;
            color: var(--text-dark);
            border: 1px solid var(--border-light);
            padding: 0.8rem 1.5rem;
            border-radius: 16px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .btn-secondary:hover {
            background: var(--gray-bg);
            border-color: #d1d5db;
        }

        .admin-card {
            background: white;
            border-radius: 32px;
            padding: 2.5rem;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-md);
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
        }

        .admin-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gradient-primary);
            border-radius: 32px 32px 0 0;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
        }

        .card-header h3 {
            font-weight: 700;
            font-size: 1.3rem;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-header h3 i {
            color: var(--red-primary);
            background: var(--red-light);
            padding: 8px;
            border-radius: 12px;
            font-size: 1rem;
        }

        .filter-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .search-input, .filter-select {
            padding: 0.8rem 1.2rem;
            border: 1px solid var(--border-light);
            border-radius: 14px;
            font-size: 0.95rem;
            background: #f8fafd;
            color: var(--text-dark);
            transition: all 0.2s ease;
            outline: none;
        }

        .search-input { flex: 1; min-width: 250px; }

        .search-input:focus, .filter-select:focus {
            border-color: var(--red-primary);
            background: white;
            box-shadow: 0 0 0 4px var(--red-soft);
        }

        /* === TABLE STYLES === */
        .data-table {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 12px;
        }

        th {
            padding: 1.2rem 1rem;
            text-align: left;
            font-weight: 700;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid var(--border-light);
            position: relative;
        }

        td {
            padding: 1.5rem 1rem;
            background: white;
            color: var(--text-dark);
            font-size: 0.95rem;
            border-bottom: 1px solid #f0f3fa;
            font-weight: 500;
            border-radius: 12px;
            transition: all 0.2s ease;
        }

        tr:hover td {
            background: var(--gradient-soft);
            transform: scale(1.01);
        }

        .shoe-name {
            font-weight: 800;
            color: var(--text-dark);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .badge-info { 
            background: var(--gradient-soft);
            color: #0369a1;
            border: 1px solid rgba(3, 105, 161, 0.2);
        }

        .badge-success { 
            background: linear-gradient(135deg, #e0f2e2 0%, #c8e6c9 100%);
            color: #1f7840;
            border: 1px solid rgba(31, 120, 64, 0.2);
        }

        .action-buttons {
            display: flex;
            gap: 0.6rem;
        }

        .btn-action {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .btn-edit { background: #eff6ff; color: #2563eb; }
        .btn-edit:hover { background: #2563eb; color: white; }

        .btn-delete { background: var(--red-light); color: var(--red-primary); }
        .btn-delete:hover { background: var(--red-primary) ; color: white; }

        /* === MODAL === */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(30, 31, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal.active { display: flex; animation: fadeIn 0.3s ease; }

        .modal-content {
            background: white;
            border-radius: 28px;
            width: 100%;
            max-width: 550px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            position: relative;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-header {
            padding: 2rem 2.5rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-light);
        }

        .modal-header h3 { font-size: 1.5rem; font-weight: 700; color: var(--text-dark); }

        .close-modal {
            background: var(--gray-bg);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
            transition: 0.2s;
        }

        .close-modal:hover { background: var(--red-light); color: var(--red-primary); transform: rotate(90deg); }

        form { padding: 2rem 2.5rem; }

        .form-group { margin-bottom: 1.5rem; }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 0.6rem;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.8rem 1.2rem;
            border: 1px solid var(--border-light);
            border-radius: 14px;
            font-size: 1rem;
            background: #f8fafd;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--red-primary);
            background: white;
            box-shadow: 0 0 0 4px var(--red-soft);
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2.5rem;
        }

        .form-actions button { flex: 1; padding: 1rem; border-radius: 16px; }

        .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-muted); }
        .empty-state i { font-size: 3.5rem; margin-bottom: 1.5rem; color: var(--border-light); }

        /* Sidebar Footer */
        .sidebar-footer {
            margin-top: auto;
            border-top: 1px solid var(--border-light);
            padding-top: 1.5rem;
        }

        .admin-profile {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: var(--gray-bg);
            border-radius: 16px;
        }

        .admin-avatar {
            width: 40px;
            height: 40px;
            background: var(--red-primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
        }

        .admin-info h4 { font-size: 0.9rem; font-weight: 600; }
        .admin-info p { font-size: 0.75rem; color: var(--text-muted); }
    </style>
</head>
<body>
    <aside class="dashboard-sidebar">
        <div class="sidebar-logo">
            <div class="logo-fallback"><i class="fas fa-shoe-prints"></i></div>
            <div class="logo-text">NAKick<span>.</span></div>
        </div>

        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-tachometer-alt"></i>
                <span>Dashboard</span>
            </a>
            <a href="shoes.html" class="nav-item active">
                <i class="fas fa-shoe-prints"></i>
                <span>Shoes</span>
            </a>
            <a href="skus.html" class="nav-item">
                <i class="fas fa-layer-group"></i>
                <span>SKUs</span>
            </a>
            <a href="images.html" class="nav-item">
                <i class="fas fa-image"></i>
                <span>Images</span>
            </a>
            <a href="users.html" class="nav-item">
                <i class="fas fa-users"></i>
                <span>Users</span>
            </a>
            <a href="orders.html" class="nav-item">
                <i class="fas fa-shopping-cart"></i>
                <span>Orders</span>
            </a>
            <a href="analytics.html" class="nav-item">
                <i class="fas fa-chart-line"></i>
                <span>Analytics</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="admin-profile">
                <div class="admin-avatar">JD</div>
                <div class="admin-info">
                    <h4>Jessie Du</h4>
                    <p>Inventory Admin</p>
                </div>
            </div>
        </div>
    </aside>

    <main class="dashboard-main">

        <div class="main-header">
            <div class="header-left">
                <h1><i class="fas fa-shoe-prints"></i> Shoes Management</h1>
                <p>Manage your shoe catalog and inventory</p>
            </div>
            <button class="btn-primary" onclick="showCreateShoeForm()">
                <i class="fas fa-plus"></i> Add Shoe
            </button>
        </div>
        
        <div class="admin-card">
            <div class="card-header">
                <h3><i class="fas fa-list"></i> Shoe Catalog</h3>
                <button class="btn-secondary" onclick="loadShoes()"><i class="fas fa-sync-alt"></i></button>
            </div>
            
            <div class="filter-bar">
                <input type="text" id="shoeSearch" placeholder="Search shoes by name..." class="search-input">
                <select id="brandFilter" class="filter-select">
                    <option value="">All Brands</option>
                </select>
                <select id="categoryFilter" class="filter-select">
                    <option value="">All Categories</option>
                    <option value="running">Running</option>
                    <option value="training">Training</option>
                    <option value="lifestyle">Lifestyle</option>
                    <option value="basketball">Basketball</option>
                    <option value="soccer">Soccer</option>
                </select>
            </div>

            <div class="data-table">
                <table>
                    <thead>
                        <tr>
                            <th>Shoe Name</th>
                            <th>Brand</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="shoesTable">
                        <tr>
                            <td colspan="6" class="empty-state">
                                <i class="fas fa-circle-notch fa-spin"></i><br>
                                Loading shoes...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="shoeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="shoeModalTitle">Add New Shoe</h3>
                <button class="close-modal" onclick="closeModal('shoeModal')">&times;</button>
            </div>
            <form id="shoeForm">
                <div class="form-group">
                    <label for="shoeName">Shoe Name</label>
                    <input type="text" id="shoeName" required placeholder="e.g. Air Max 2024">
                </div>
                <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="shoeBrand">Brand</label>
                        <input type="text" id="shoeBrand" required placeholder="e.g. Nike">
                    </div>
                    <div class="form-group">
                        <label for="shoeCategory">Category</label>
                        <select id="shoeCategory" required>
                            <option value="">Select Category</option>
                            <option value="running">Running</option>
                            <option value="training">Training</option>
                            <option value="lifestyle">Lifestyle</option>
                            <option value="basketball">Basketball</option>
                            <option value="soccer">Soccer</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="shoeDescription">Description</label>
                    <textarea id="shoeDescription" placeholder="Enter product details..." rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="shoePrice">Price ($)</label>
                    <input type="number" id="shoePrice" step="0.01" required placeholder="0.00">
                </div>
                <div class="form-group">
                    <label for="shoeImage">Shoe Image</label>
                    <input type="file" id="shoeImage" accept="image/*" style="padding: 0.5rem;">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal('shoeModal')">Cancel</button>
                    <button type="submit" class="btn-primary">Save Shoe</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const GATEWAY_BASE_URL = 'http://localhost:8080';
        let currentEditId = null;
        let authToken = localStorage.getItem('authToken') || sessionStorage.getItem('authToken') || '';

        function getAuthHeaders() {
            return {
                'Authorization': `Bearer ${authToken}`
            };
        }

        function openModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
            currentEditId = null;
            document.getElementById('shoeForm').reset();
        }

        async function loadShoes() {
            const tbody = document.getElementById('shoesTable');
            try {
                const response = await fetch(`${GATEWAY_BASE_URL}/shoes-service/api/shoes`, {
                    headers: getAuthHeaders()
                });
                
                if (!response.ok) throw new Error('Failed to load shoes');
                
                const shoes = await response.json();
                
                if (!shoes || shoes.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="empty-state"><i class="fas fa-inbox"></i><br>No shoes found</td></tr>';
                    return;
                }

                tbody.innerHTML = shoes.map(shoe => {
                    const name = shoe.model || shoe.name || 'Unnamed Shoe';
                    const brand = shoe.brand || 'No Brand';
                    const category = shoe.category || 'General';
                    const price = shoe.basePrice || 0;
                    const imageUrl = shoe.imageUrl || 'https://via.placeholder.com/50';
                    const id = shoe.id;
                    
                    return `
                    <tr>
                        <td class="shoe-name">
                            <img src="${imageUrl}" alt="${name}" style="width:40px;height:40px;object-fit:cover;border-radius:8px;margin-right:10px;vertical-align:middle;">
                            ${name}
                        </td>
                        <td>${brand}</td>
                        <td><span class="badge badge-info">${category}</span></td>
                        <td style="font-weight:700;">$${parseFloat(price).toFixed(2)}</td>
                        <td><span class="badge badge-success">Active</span></td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn-action btn-edit" title="Edit" onclick="editShoe('${id}')">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn-action btn-delete" title="Delete" onclick="deleteShoe('${id}')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
                }).join('');
                
                populateBrandFilters(shoes);
            } catch (error) {
                console.error('Error loading shoes:', error);
                tbody.innerHTML = '<tr><td colspan="6" class="empty-state" style="color:var(--red-primary)"><i class="fas fa-exclamation-circle"></i><br>Error loading data</td></tr>';
            }
        }

        function populateBrandFilters(shoes) {
            const brands = [...new Set(shoes.map(s => s.brand || 'Unknown'))];
            const select = document.getElementById('brandFilter');
            select.innerHTML = '<option value="">All Brands</option>' + 
                brands.map(brand => `<option value="${brand}">${brand}</option>`).join('');
        }

        function showCreateShoeForm() {
            document.getElementById('shoeModalTitle').textContent = 'Add New Shoe';
            currentEditId = null;
            document.getElementById('shoeForm').reset();
            openModal('shoeModal');
        }

        async function editShoe(id) {
            try {
                const response = await fetch(`${GATEWAY_BASE_URL}/shoes-service/api/shoes/${id}`, {
                    headers: getAuthHeaders()
                });
                
                if (!response.ok) throw new Error('Failed to fetch shoe');
                
                const shoe = await response.json();
                currentEditId = id;
                
                document.getElementById('shoeModalTitle').textContent = 'Edit Shoe';
                document.getElementById('shoeName').value = shoe.model || '';
                document.getElementById('shoeBrand').value = shoe.brand || '';
                document.getElementById('shoeCategory').value = shoe.category || '';
                document.getElementById('shoeDescription').value = shoe.description || '';
                document.getElementById('shoePrice').value = shoe.basePrice || 0;
                document.getElementById('shoeImage').value = '';
                
                openModal('shoeModal');
            } catch (error) {
                console.error('Error editing shoe:', error);
                alert('Failed to load shoe for editing');
            }
        }

        async function deleteShoe(id) {
            if (!confirm('Are you sure you want to delete this shoe?')) return;
            
            try {
                const response = await fetch(`${GATEWAY_BASE_URL}/shoes-service/api/shoes/${id}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });
                
                if (!response.ok) throw new Error('Failed to delete shoe');
                
                loadShoes();
            } catch (error) {
                console.error('Error deleting shoe:', error);
                alert('Failed to delete shoe');
            }
        }

        document.getElementById('shoeForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const shoeData = {
                brand: document.getElementById('shoeBrand').value,
                model: document.getElementById('shoeName').value,
                category: document.getElementById('shoeCategory').value,
                description: document.getElementById('shoeDescription').value,
                basePrice: parseFloat(document.getElementById('shoePrice').value)
            };
            
            const btn = e.submitter;
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Saving...';

            try {
                let response;
                const url = currentEditId 
                    ? `${GATEWAY_BASE_URL}/shoes-service/api/shoes/${currentEditId}`
                    : `${GATEWAY_BASE_URL}/shoes-service/api/shoes`;

                if (currentEditId) {
                    // PUT - Update existing shoe (Send as JSON)
                    response = await fetch(url, {
                        method: 'PUT',
                        headers: {
                            ...getAuthHeaders(),
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(shoeData)
                    });
                } else {
                    // POST - Create new shoe (Send as FormData for image support)
                    const formData = new FormData();
                    formData.append('shoe', JSON.stringify(shoeData));
                    
                    const imageFile = document.getElementById('shoeImage').files[0];
                    if (imageFile) {
                        formData.append('image', imageFile);
                    }

                    response = await fetch(url, {
                        method: 'POST',
                        headers: getAuthHeaders(),
                        body: formData
                    });
                }
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server Error: ${errorText}`);
                }
                
                closeModal('shoeModal');
                loadShoes();
            } catch (error) {
                console.error('Error saving shoe:', error);
                alert(`Error: ${error.message}`);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

        // Search and Filter functionality
        document.getElementById('shoeSearch').addEventListener('input', filterTable);
        document.getElementById('brandFilter').addEventListener('change', filterTable);
        document.getElementById('categoryFilter').addEventListener('change', filterTable);

        function filterTable() {
            const searchTerm = document.getElementById('shoeSearch').value.toLowerCase();
            const brandTerm = document.getElementById('brandFilter').value.toLowerCase();
            const categoryTerm = document.getElementById('categoryFilter').value.toLowerCase();
            
            const rows = document.querySelectorAll('#shoesTable tr');
            
            rows.forEach(row => {
                if (row.querySelector('.empty-state')) return;
                
                const name = row.cells[0].textContent.toLowerCase();
                const brand = row.cells[1].textContent.toLowerCase();
                const category = row.cells[2].textContent.toLowerCase();
                
                const matchesSearch = name.includes(searchTerm);
                const matchesBrand = brandTerm === '' || brand === brandTerm;
                const matchesCategory = categoryTerm === '' || category === categoryTerm;
                
                row.style.display = (matchesSearch && matchesBrand && matchesCategory) ? '' : 'none';
            });
        }

        document.addEventListener('DOMContentLoaded', loadShoes);
    </script>
</body>
</html>
