server:
  port: 8080

spring:
  application:
    name: API-GATEWAY
  docker:
    compose:
      enabled: false
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka