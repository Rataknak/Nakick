server:
  port: 8085

app:
  server-url: ${SERVER_URL:http://localhost:8085}

spring:
  application:
    name: payment-service
  docker:
    compose:
      enabled: false
  
  # MongoDB Database Configuration
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://paymentuser:paymentpass@mongodb-payment:27017/?authSource=admin}
      database: paymentdb

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: payment-service
    prefer-ip-address: true

stripe:
  api-key: ${STRIPE_API_KEY:placeholder_stripe_api_key}
  public-key: ${STRIPE_PUBLIC_KEY:placeholder_stripe_public_key}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:placeholder_stripe_webhook_secret}

logging:
  level:
    com.nakick.payment: INFO
    root: WARN
